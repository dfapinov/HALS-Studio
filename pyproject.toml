[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hals-studio"
version = "0.5.0"
description = "HALS loudspeaker measurement processing, analysis and export desktop app"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hals_studio = ["resources/**/*", "resources/*", "process_engine/*.json", "process_engine/*.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F821"]
