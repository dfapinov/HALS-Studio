name: Application regression checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check for undefined names
        run: python -m ruff check src tests scripts
      - name: Run numerical, persistence, and Qt regression tests
        run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Verify the real four-stage pipeline with spawned workers
        run: python scripts/verify_pipeline.py
      - name: Verify project and workspace interactions
        run: python scripts/verify_studio_workspace.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-results
          path: artifacts/test-results.xml
